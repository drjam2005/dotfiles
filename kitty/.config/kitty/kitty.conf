# BEGIN_KITTY_FONTS
font_family      family="Iosevka Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
# BEGIN_KITTY_THEME
# Dimmed Monokai
include current-theme.conf
# include colors-kitty.conf
# END_KITTY_THEME
# font_family IosevkaTerm NF SemiBold
# bold_font auto
font_size 20.0

cursor_shape block
cursor_shape_unfocused block
cursor_blink_interval 0
# cursor #ffffff
# cursor_trail 10
# cursor_trail_decay 0.02 0.05
# cursor_trail_start_threshold 0
 
window_padding_width 10 10
confirm_os_window_close 0
background_opacity 1.0
background_blur 1

shell_integration disabled
enable_audio_bell disabled

keyboard_protocol disabled

allow_remote_control yes

# bindings
enabled_layouts splits,stack
map ctrl+shift+enter new_window_with_cwd
# map alt+shift+k move_window top
# map alt+shift+h move_window left
# map alt+shift+l move_window right
# map alt+shift+j move_window bottom

map alt+k neighboring_window top
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+j neighboring_window bottom
map ctrl+shift+z toggle_layout stack

map alt+shift+k layout_action move_to_screen_edge top
map alt+shift+h layout_action move_to_screen_edge left
map alt+shift+l layout_action move_to_screen_edge right
map alt+shift+j layout_action move_to_screen_edge bottom
