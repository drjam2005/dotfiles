[colors]
background = #050505
background-alt = #AAAAAA
foreground = #ffffff
primary = #AAAAAA
secondary = #676767
alert = #525252
disabled = #707070

[bar/example]
height = 25pt
radius = 10
width = 100%
padding-right=1
dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 5pt
border-color = #00000000

separator = " | "
separator-background = #050505

font-0 = "Iosevka NFP SemiBold:size=12;3"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = memory pulseaudio systray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true


; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 5pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-foreground = #050505
label-active-underline= ${colors.primary}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 1
label-occupied-background = #050505
label-occupied-foreground = #ababab

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
format = <label>
label = %title:0:60:...%
label-radius = 0
label-foreground = #ababab

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %gb_used:2%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %A %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/battery]
type = internal/battery
full-at = 100
low-at = 5
battery = BAT0
adapter = AC0
poll-interval=5
time-format = %H:%M
format-charging-prefix="CHRG: "
label-charging = %percentage%% %time%
format-charging-prefix-foreground = #ababab
format-charging = <label-charging>
format-discharging-prefix-foreground = #ababab
format-discharging-prefix="BATT: "
label-discharging = %percentage%% %consumption%W %time%
format-full-prefix-foreground = #ababab
format-full-prefix="FULL: "
label-full= %percentage%% %consumption%W

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
label-connected = %downspeed:4%
label-disconnected = NoNet
