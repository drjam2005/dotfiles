backend = "glx";
corner-radius = 7;

blur-method = "dual_kawase";
blur-strength = 3;

rules = (
  {
	  match = "focused || group_focused";
	  opacity = 1.0;
  },
  {
	  match = "!(focused || group_focused)";
	  opacity = 0.90;
  },
  {
	  match = "class_g = 'dunst'";
	  corner-radius = 0;
  },
  {
	  match = "fullscreen";
	  corner-radius = 0;
  },
  {
	  match = "class_g = 'Boomer'";
	  opacity = 1.0;
	  corner-radius = 0;
	  animations = (
		  {
			  triggers = ["close", "hide", "decrease-opacity"];
			  preset = "disappear";
			  duration = 0.001;
			  scale = 1.0;
		  },
		  {
			  triggers = [
				  "open", "show",
				  "increase-opacity",
				  "size", "position",
				  "color"
			  ];
		  }
	  );
  }
);

animations = (
  {
	  triggers = ["open"];
	  preset = "appear";
	  scale = 0.8;
	  duration = 0.2;
  },
  {
	  triggers = ["increase-opacity"];
	  preset = "appear";
	  scale = 0.95;
	  duration = 0.25;
  },
  {
	  triggers = ["close"];
	  preset = "disappear";
	  duration = 0.2;
	  scale = 0.9;
  },
  {
	  triggers = ["hide"];
	  preset = "disappear";
	  duration = 0.2;
	  scale = 0.9;
  },
  {
	  triggers = ["size", "position"];
	  preset = "appear";
	  duration = 0.2;
	  scale = 0.95;
  },
);
