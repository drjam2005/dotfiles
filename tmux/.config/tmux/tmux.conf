set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*;RGB"
set -g mouse on
set -g set-clipboard on

unbind C-b
set -g prefix C-q
bind-key C-q send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload configo
unbind r
bind r source-file /home/james/.config/tmux/tmux.conf

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane


# 1. Transparent background & subtle text color
set-option -g status-style bg=default,fg=colour240

# 2. Left side: Keep only a clean session name
set-option -g status-left "#[fg=colour245,bold] #S #[fg=colour240,nobold]│ "
set-option -g status-left-length 50

# 3. Right side: Wipe out the default date/time/hostname clutter (or leave empty)
set-option -g status-right ""

# 4. Window tabs: Clean formatting for active and inactive windows
set-window-option -g window-status-current-format "#[fg=colour250,bold] #I:#W#F "
set-window-option -g window-status-format "#[fg=colour240] #I:#W "

# 5. Optional: Move the status bar to the top if you prefer that aesthetic
# set-option -g status-position top
